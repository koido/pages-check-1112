   pre.textContent=t||'（空のファイルです）'}).catch(err=>{if(tok===showTok)pre.textContent=FETCH_FAIL})}
 else if(['png','jpg','jpeg'].includes(x)){const a=link('',n.u),img=el('img');img.src=n.u;img.alt=n.name;a.append(img);v.append(a,el('p','more','画像を押すと大きく開きます。'))}

const icons=desktop.children.map(n=>{const d=el('div','di'),b=el('span','big'),l=el('span','l',n.name);b.style.backgroundImage=ICONS[icon(n)];d.append(b,l);
 d.onclick=()=>{document.querySelectorAll('.di.on').forEach(x=>x.classList.remove('on'));d.classList.add('on');if(phone()||matchMedia('(hover:none)').matches)openIcon(n)};d.ondblclick=()=>openIcon(n);
 if(!isD(n)&&ext(n)==='csv'){d.oncontextmenu=e=>{e.preventDefault();openCtx(e.clientX,e.clientY,n)};bindLongPress(d,n)}

// --- Figure 3 tool: the senior's plotting tool, right-click/long-press on a
// CSV (or the button in the preview pane). Mirrors the SAME algorithm as
// scripts/make_assets.py (fig3_table/fingerprint_of) and 論文用/make_fig3.py.
// No network beyond this site's own files, no localStorage, no external libs.
let ctxNode=null,swallowClick=false;
function openCtx(x,y,n,offsetY=0){ctxNode=n;const m=$('csvctx');m.classList.add('on');const mg=8;
 m.style.left=Math.min(x,innerWidth-m.offsetWidth-mg)+'px';m.style.top=Math.min(y+offsetY,innerHeight-m.offsetHeight-mg)+'px'}
function closeCtx(){$('csvctx').classList.remove('on')}
// A long-press's finger-lift can fire a trailing click on some browsers;
// swallow exactly that one click (capture phase, before tr/d's own onclick)
// instead of guessing at a timeout. On Android, a long press instead fires
// a native contextmenu with no click following at all, which would leave
// swallowClick stuck true and eat the next, unrelated click; resetting it
// on every new pointerdown fixes that, since the one genuine trailing click
// (when a browser does send it) has no new pointerdown before it arrives.
document.addEventListener('pointerdown',()=>{swallowClick=false},true);
document.addEventListener('click',e=>{if(swallowClick){swallowClick=false;e.stopPropagation()}},true);
addEventListener('scroll',()=>closeCtx(),true);
document.addEventListener('keydown',e=>{if(e.isComposing)return;if(e.key!=='Escape')return;closeCtx();menu.classList.remove('on');fm.classList.remove('on');$('exp').classList.remove('on');$('dobon').classList.remove('on');$('fig3').classList.remove('on')});
function bindLongPress(elm,n){let t=null,sx=0,sy=0;
 const cancel=()=>{if(t){clearTimeout(t);t=null}};
 elm.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch'||!e.isPrimary)return;cancel();const x=e.clientX,y=e.clientY;sx=x;sy=y;
  t=setTimeout(()=>{t=null;swallowClick=true;openCtx(x,y,n,14)},500)});
 elm.addEventListener('pointerup',cancel);
 elm.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-sx,e.clientY-sy)>10)cancel()});
 elm.addEventListener('pointercancel',cancel)}
$('csvctxrun').onclick=e=>{e.stopPropagation();$('csvctx').classList.remove('on');if(ctxNode)runFig3(ctxNode)};
$('fig3close').onclick=()=>$('fig3').classList.remove('on');
$('fig3').onclick=e=>{if(e.target===e.currentTarget&&e.detail<2)$('fig3').classList.remove('on')};
function fig3SetBody(...kids){$('fig3body').replaceChildren(...kids)}

// Pure-JS SHA-256 (no deps), used only when crypto.subtle is unavailable
// (a non-secure context, e.g. plain http://). Verified against Node's
// crypto and known test vectors while building this tool.
function sha256Fallback(bytes){
 const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
 let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
 const l=bytes.length,total=Math.ceil((l+9)/64)*64,buf=new Uint8Array(total);
 buf.set(bytes);buf[l]=0x80;
 const dv=new DataView(buf.buffer);
 dv.setUint32(total-4,(l*8)>>>0,false);
 dv.setUint32(total-8,Math.floor(l/0x20000000),false);
 const w=new Uint32Array(64),rotr=(x,n)=>(x>>>n)|(x<<(32-n));
 for(let off=0;off<total;off+=64){
  for(let i=0;i<16;i++)w[i]=dv.getUint32(off+i*4,false);
  for(let i=16;i<64;i++){const s0=rotr(w[i-15],7)^rotr(w[i-15],18)^(w[i-15]>>>3),s1=rotr(w[i-2],17)^rotr(w[i-2],19)^(w[i-2]>>>10);
   w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
  let[a,b,c,d,e,f,g,h]=H;
  for(let i=0;i<64;i++){const S1=rotr(e,6)^rotr(e,11)^rotr(e,25),ch=(e&f)^(~e&g),temp1=(h+S1+ch+K[i]+w[i])|0;
   const S0=rotr(a,2)^rotr(a,13)^rotr(a,22),maj=(a&b)^(a&c)^(b&c),temp2=(S0+maj)|0;
   h=g;g=f;f=e;e=(d+temp1)|0;d=c;c=b;b=a;a=(temp1+temp2)|0}
  H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}
 return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}
async function sha256Hex(bytes){
 if(window.crypto&&crypto.subtle&&window.isSecureContext){const buf=await crypto.subtle.digest('SHA-256',bytes);
  return[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}
 return sha256Fallback(bytes)}
async function fingerprintOf(byteArrays){
 const hashes=[];for(const b of byteArrays)hashes.push(await sha256Hex(b));
 hashes.sort();
 return(await sha256Hex(new TextEncoder().encode(hashes.join('')))).slice(0,8)}

// Shared algorithm (see scripts/make_assets.py's fig3_table): per CSV,
// DMSO = mean(CH1-4), K10 = mean(CH5-8) per time point, each series
// normalised by its own first value; mean and sample SD (n-1) across the
// 3 files, per time point and group. Used only to draw a plot.
function parseInstrumentRows(text){const rows=[];
 for(const line of text.split(/\r?\n/)){const cells=line.split(',');if(cells.length!==10)continue;
  if(cells.some(c=>c.trim()===''))continue;
  const nums=cells.map(Number);if(nums.some(Number.isNaN))continue;rows.push(nums)}
 return rows}
function fig3Table(rowsList){
 const n=Math.min(...rowsList.map(r=>r.length));
 const dmsoSeries=[],k10Series=[];let tRef=null;
 for(const rows of rowsList){const t=rows.slice(0,n).map(r=>r[0]);if(!tRef)tRef=t;
  const dmso=rows.slice(0,n).map(r=>(r[2]+r[3]+r[4]+r[5])/4),k10=rows.slice(0,n).map(r=>(r[6]+r[7]+r[8]+r[9])/4);
  dmsoSeries.push(dmso.map(v=>v/dmso[0]));k10Series.push(k10.map(v=>v/k10[0]))}
 const mean=(arr,i)=>arr.reduce((s,ser)=>s+ser[i],0)/arr.length;
 const sd=(arr,i,m)=>Math.sqrt(arr.reduce((s,ser)=>s+(ser[i]-m)**2,0)/(arr.length-1));
 const dmso_mean=[],dmso_sd=[],k10_mean=[],k10_sd=[];
 for(let i=0;i<n;i++){const dm=mean(dmsoSeries,i),km=mean(k10Series,i);
  dmso_mean.push(dm);dmso_sd.push(sd(dmsoSeries,i,dm));k10_mean.push(km);k10_sd.push(sd(k10Series,i,km))}
 return{t:tRef,dmso_mean,dmso_sd,k10_mean,k10_sd}}

function drawFig3Canvas(canvas,table,fp){
 const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;
 ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
 const padL=48,padR=12,padT=26,padB=34,footH=26,plotW=w-padL-padR,plotH=h-padT-padB-footH;
 const t=table.t,tMax=96,x=tt=>padL+plotW*tt/tMax;
 const vals=[...table.dmso_mean,...table.k10_mean].concat(table.dmso_mean.map((v,i)=>v+table.dmso_sd[i]),table.k10_mean.map((v,i)=>v+table.k10_sd[i]));
 const yMin=Math.min(0,...vals),yMax=Math.max(1,...vals),y=v=>padT+plotH*(1-(v-yMin)/(yMax-yMin));
 ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(padL,padT);ctx.lineTo(padL,padT+plotH);ctx.lineTo(padL+plotW,padT+plotH);ctx.stroke();
 ctx.fillStyle='#333';ctx.font='10px sans-serif';ctx.textAlign='center';
 for(const hh of[0,24,48,72,96])ctx.fillText(String(hh),x(hh),padT+plotH+14);
 ctx.fillText('時間 (h)',padL+plotW/2,h-footH-4);
 function band(mean,sd,color,alpha){ctx.fillStyle=color;ctx.globalAlpha=alpha;ctx.beginPath();
  for(let i=0;i<t.length;i++){const px=x(t[i]),py=y(mean[i]+sd[i]);i?ctx.lineTo(px,py):ctx.moveTo(px,py)}
  for(let i=t.length-1;i>=0;i--)ctx.lineTo(x(t[i]),y(mean[i]-sd[i]));
  ctx.closePath();ctx.fill();ctx.globalAlpha=1}
 function line(mean,color){ctx.strokeStyle=color;ctx.lineWidth=1.3;ctx.beginPath();
  for(let i=0;i<t.length;i++){const px=x(t[i]),py=y(mean[i]);i?ctx.lineTo(px,py):ctx.moveTo(px,py)}
  ctx.stroke()}
 band(table.dmso_mean,table.dmso_sd,'#000',0.15);band(table.k10_mean,table.k10_sd,'#888',0.25);
 line(table.dmso_mean,'#000');line(table.k10_mean,'#888');
 ctx.textAlign='left';ctx.font='10px sans-serif';ctx.fillStyle='#333';
 ctx.fillText('黒: DMSO 灰: 化合物K 10 µM',padL+4,padT+10);
 ctx.textAlign='center';ctx.font='12px sans-serif';ctx.fillText('図3 n = 3',padL+plotW/2,16);
 ctx.fillStyle='#ebebeb';ctx.fillRect(0,h-footH,w,footH);
 ctx.strokeStyle='#aaa';ctx.beginPath();ctx.moveTo(0,h-footH);ctx.lineTo(w,h-footH);ctx.stroke();
 ctx.fillStyle='#282828';ctx.font='12px sans-serif';ctx.textAlign='left';ctx.fillText('入力の指紋: '+fp,8,h-footH/2+4)}

let fig3Tok=0;
async function runFig3(n){
 const tok=++fig3Tok;
 $('fig3title').textContent='先輩の作図ツール';
 fig3SetBody(el('p','fig3note','計算中…'));
 $('fig3').classList.add('on');
 try{
  const rep1=nodes.get('デスクトップ/先輩のフォルダ/論文用/図3_input/DATA0108.CSV');
  const rep2=nodes.get('デスクトップ/先輩のフォルダ/論文用/図3_input/DATA0110.CSV');
  const rough=nodes.get('デスクトップ/図3_荒いと言われたもの.png');
  if(!rep1||!rep2)throw new Error('先輩: 論文用/図3_input が見当たらない…先輩のフォルダ、動かしてない？');
  const bufs=await Promise.all([rep1,rep2,n].map(x=>fetch(x.u).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()}).catch(()=>{throw new Error(FETCH_FAIL)})));
  if(tok!==fig3Tok)return;
  if(bufs[2].byteLength===0)throw new Error('先輩: そのファイル、空っぽだよ。');
  const texts=bufs.map(b=>new TextDecoder('ascii').decode(b));
  for(const t of texts)if(!t.startsWith('Luminescence Monitor YH-8,'))
   throw new Error('先輩: それ、装置のCSVじゃない気がする…装置が書き出した DATA で始まるファイルを選んでみて。');
  const rowsList=texts.map(parseInstrumentRows);
  if(rowsList.some(r=>r.length<2))throw new Error('先輩: データ行がうまく読めなかった。CSVが壊れてない？');
  const table=fig3Table(rowsList),fp=await fingerprintOf(bufs.map(b=>new Uint8Array(b)));
  if(tok!==fig3Tok)return;
  const canvas=el('canvas');canvas.width=420;canvas.height=300;
  drawFig3Canvas(canvas,table,fp);
  const img=el('img');img.alt='図3（荒い）';if(rough)img.src=rough.u;
  const cols=el('div','fig3cols'),c1=el('div'),c2=el('div');
  c1.append(el('h4',null,'いま計算した図（2回分＋選んだCSV）'),canvas);
  c2.append(el('h4',null,'元の図3（荒い。指紋なし）'),img);
  cols.append(c1,c2);
  const note=el('p','fig3note',`入力ファイルの指紋: ${fp}\n論文用/図3_スクショ.png の窓の下の数字と見比べてください。同じなら、選んだCSVが正解。`);
  note.style.whiteSpace='pre-line';
  fig3SetBody(cols,note);
 }catch(err){if(tok===fig3Tok)fig3SetBody(el('p','fig3note',(err&&err.message)||String(err)))}}

blank();render();
